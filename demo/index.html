    <main id="demo">
      <noscript>
        <h1>Instant</h1>
        <p>
          An FFGL effect that develops your clip as an integral instant print
          while you watch. A Take exposes the frame, metered the way a camera
          would, and the print comes up out of a dark green-grey opacifier, pale
          and blue-cyan at first, warming to full colour as the slower magenta
          and yellow dyes arrive, each layer first-order at its own rate.
          Temperature scales every rate by the Arrhenius law, and because the
          timing layer that stops development speeds up less than the dyes do,
          cold film stops short, pale and green, as the manufacturer describes,
          while hot film finishes warm. A short or uneven spread leaves
          undeveloped corners, expired paste doesn't reach as far, and a dirty
          roller repeats its mark at its circumference. Shaking it doesn't help.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/instant">its repository</a>.
        </p>
